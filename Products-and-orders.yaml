openapi: 3.0.0
info:
  title: Products and Orders
  description: An API to manage products and orders
  version: 1.0.0

servers:
  - url: https://api.example.com/v1

paths:
  /api/products:
    get:
      summary: Returns a list of products from the database
      operationId: getProducts
      tags:
        - Products
      responses:
        '200':
          description: A list of current products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductsList.yaml'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a new product in the database
      operationId: createProduct
      tags:
        - Products
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewProduct.yaml'
      responses:
        '201':
          description: Product created

  /api/products/{productId}:
    get:
      summary: Returns a single product
      operationId: getProductById
      tags:
        - Products
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product found
        '404':
          description: Product not found

    put:
      summary: Updates an existing product
      operationId: updateProduct
      tags:
        - Products
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProduct.yaml'
      responses:
        '200':
          description: Product updated

    delete:
      summary: Deletes a product
      operationId: deleteProduct
      tags:
        - Products
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Product deleted

  /api/orders:
    get:
      summary: Returns a list of orders
      operationId: getOrders
      tags:
        - Orders
      responses:
        '200':
          description: A list of orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdersList.yaml'

    post:
      summary: Create a new order
      operationId: createOrder
      tags:
        - Orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewOrder.yaml'
      responses:
        '201':
          description: Order created

  /api/orders/{orderId}:
    get:
      summary: Returns a single order
      operationId: getOrderById
      tags:
        - Orders
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order found
        '404':
          description: Order not found

    put:
      summary: Updates an existing order
      operationId: updateOrder
      tags:
        - Orders
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrder.yaml'
      responses:
        '200':
          description: Order updated

    delete:
      summary: Deletes an order
      operationId: deleteOrder
      tags:
        - Orders
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Order deleted

components:
  schemas:
    ProductsList.yaml:
      type: object
    NewProduct.yaml:
      type: object
    UpdateProduct.yaml:
      type: object
    OrdersList.yaml:
      type: object
    NewOrder.yaml:
      type: object
    UpdateOrder.yaml:
      type: object
