name: Update-Postman-SpecHub-Spec

on:
  push:
    branches: ["*"]
    paths:
      - '**/*.yaml'
      - '**/*.json'
  pull_request:
    branches: ["*"]
    paths:
      - '**/*.yaml'
      - '**/*.json'

env:
  MAX_RETRIES: 3
  RETRY_DELAY: 10
  SPEC_SEARCH_PATH: specs

jobs:
  prepare-and-validate:
    name: Prepare and Validate Spec
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Swagger Repo
        uses: actions/checkout@v4
        with:
          repository: Postman/Products-and-Orders-test-automation

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl wget
          wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq
          chmod +x /usr/bin/yq

      - name: Find and Validate Specification File
        id: find_spec
        run: |
          set -e
          echo "🔍 Searching for specification file in ${{ env.SPEC_SEARCH_PATH }}..."
          SWAGGER_FILE=$(find "${{ env.SPEC_SEARCH_PATH }}" -maxdepth 2 -type f \( -iname "*.yaml" -o -iname "*.json" \) | head -n 1)

          if [[ -z "$SWAGGER_FILE" ]]; then
            echo "❌ No specification file found."
            exit 1
          fi

          yq eval 'true' "$SWAGGER_FILE" > /dev/null || { echo "❌ Invalid YAML/JSON."; exit 1; }

          SPEC_NAME=$(yq e '.info.title' "$SWAGGER_FILE")
          SPEC_VERSION=$(yq e '.info.version' "$SWAGGER_FILE")

          echo "SWAGGER_PATH=$SWAGGER_FILE" >> $GITHUB_ENV
          echo "SPEC_NAME=$SPEC_NAME" >> $GITHUB_ENV
          echo "SPEC_VERSION=$SPEC_VERSION" >> $GITHUB_ENV

      - name: Check Spec Existence
        id: check_spec
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
          POSTMAN_WORKSPACE_ID: ${{ secrets.POSTMAN_WORKSPACE_ID }}
        run: |
          response=$(curl -s -H "X-API-Key: $POSTMAN_API_KEY" "https://api.getpostman.com/specs?workspaceId=$POSTMAN_WORKSPACE_ID")
          EXISTING_SPEC_ID=$(echo "$response" | jq -r ".specs[] | select(.name == \"${{ env.SPEC_NAME }}\") | .id")
          echo "EXISTING_SPEC_ID=$EXISTING_SPEC_ID" >> $GITHUB_ENV
          echo "SPEC_EXISTS=$([[ -n \"$EXISTING_SPEC_ID\" ]] && echo true || echo false)" >> $GITHUB_ENV

  manage-spec:
    name: Create or Update Spec
    runs-on: ubuntu-latest
    needs: prepare-and-validate
    if: success()
    steps:
      - name: Create or Update Postman Spec
        id: manage_spec
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
          POSTMAN_WORKSPACE_ID: ${{ secrets.POSTMAN_WORKSPACE_ID }}
        run: |
          set -e
          retry() {
            local cmd="$1"
            for i in $(seq 1 ${{ env.MAX_RETRIES }}); do
              eval "$cmd" && break || sleep ${{ env.RETRY_DELAY }}
            done
          }

          if [[ "${{ env.SPEC_EXISTS }}" == "false" ]]; then
            create_spec() {
              response=$(curl -s -w "\n%{http_code}" -X POST \
                -H "Content-Type: application/json" \
                -H "X-API-Key: $POSTMAN_API_KEY" \
                -d "{\"name\": \"${{ env.SPEC_NAME }}\", \"type\": \"OPENAPI:3.0\", \"files\": [{\"path\": \"index.yaml\", \"content\": $(cat ${{ env.SWAGGER_PATH }} | jq -Rs .)}]}" \
                "https://api.getpostman.com/specs?workspaceId=$POSTMAN_WORKSPACE_ID")
              echo "$response"
            }
            retry create_spec
          else
            update_spec() {
              response=$(curl -s -w "\n%{http_code}" -X PATCH \
                -H "Content-Type: application/json" \
                -H "X-API-Key: $POSTMAN_API_KEY" \
                -d "{\"files\": [{\"path\": \"index.yaml\", \"content\": $(cat ${{ env.SWAGGER_PATH }} | jq -Rs .)}]}" \
                "https://api.getpostman.com/specs/${{ env.EXISTING_SPEC_ID }}/files/index.yaml")
              echo "$response"
            }
            retry update_spec
          fi

      - name: Generate Postman Collection
        id: gen_collection
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -H "X-API-Key: $POSTMAN_API_KEY" \
            -d "{\"name\": \"${{ env.SPEC_NAME }} Collection\", \"options\": {\"parametersResolution\": \"Example\"}}" \
            "https://api.getpostman.com/specs/${{ env.EXISTING_SPEC_ID || env.POSTMAN_SPEC_ID }}/generations/collection")
          echo "$response"

      - name: Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: postman-spec
          path: ${{ env.SWAGGER_PATH }}
