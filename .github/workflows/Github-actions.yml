name: Update Postman SpecHub Spec

on:
  workflow_dispatch:  # Allow manual trigger
  push:
    paths:
      - '**/*.yaml'
      - '**/*.json'

jobs:
  update-spec:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install jq (for JSON escaping)
        run: sudo apt-get install -y jq
      - name: 🔍 Find Swagger File
        id: find_swagger
        run: |
          echo "🔍 Searching for .yaml file..."
          SWAGGER_FILE=$(find . -maxdepth 2 -type f \( -iname "*.yaml" \) | head -n 1)

          if [[ -z "$SWAGGER_FILE" ]]; then
            echo "❌ No Swagger file (.yaml) found."
            exit 1
          else
            echo "✅ Swagger file found: $SWAGGER_FILE"
            echo "SWAGGER_PATH=$SWAGGER_FILE" >> $GITHUB_ENV
          fi
          - name: 📦 Read existing POSTMAN IDs
          id: read_meta
          run: |
          cd config-branch
          if [ -f config/spec-meta.json ]; then
            export POSTMAN_SPEC_ID=$(jq -r '.POSTMAN_SPEC_ID' config/spec-meta.json)
            export POSTMAN_COLLECTION_ID=$(jq -r '.POSTMAN_COLLECTION_ID' config/spec-meta.json)
            echo "POSTMAN_SPEC_ID=$POSTMAN_SPEC_ID" >> $GITHUB_ENV
            echo "POSTMAN_COLLECTION_ID=$POSTMAN_COLLECTION_ID" >> $GITHUB_ENV
            echo "✅ Loaded spec-meta.json"
          else
            echo "⚠️ spec-meta.json not found. Creating empty one..."
            mkdir -p config
            echo '{"POSTMAN_SPEC_ID":"","POSTMAN_COLLECTION_ID":"","LAST_UPDATED":""}' > config/spec-meta.json
          fi
          - name: 🧪 Example: Generate New IDs (Simulate API)
          run: |
          echo "NEW_SPEC_ID=spc-xyz123" >> $GITHUB_ENV
          echo "NEW_COLLECTION_ID=col-abc789" >> $GITHUB_ENV
          - name: 🔄 Update spec-meta.json
          run: |
          cd config-branch
          bash ../scripts/update-spec-meta.sh \
            "${{ env.NEW_SPEC_ID }}" \
            "${{ env.NEW_COLLECTION_ID }}"

      - name: 💾 Commit & Push to config branch
        run: |
          cd config-branch
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git add config/spec-meta.json
          git commit -m "🔄 Update spec-meta.json with new IDs"
          git push origin config
      - name: Fetch and Upload Swagger Spec to Postman
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}  # GitHub PAT with `repo` scope
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
          POSTMAN_SPEC_ID: ${{ env.NEW_SPEC_ID }}
          POSTMAN_COLLECTION_ID: ${{ env.NEW_COLLECTION_ID }}
        run: |
          echo "📥 Fetching Swagger from: $SWAGGER_FILE"
          RAW_YAML=$(curl -s -H "Authorization: token ${GH_TOKEN}" "$SWAGGER_FILE")

          # Check for 404 or GitHub error response
          if echo "$RAW_YAML" | grep -q "404: Not Found"; then
            echo "❌ ERROR: File not found or access denied. Exiting."
            exit 1
          fi

          # Escape YAML for JSON payload
          SPEC_CONTENT=$(echo "$RAW_YAML" | jq -Rs .)

          # Write escaped JSON payload
          echo "{\"content\": ${SPEC_CONTENT}}" > payload.json

          echo "📦 Payload preview:"
          cat payload.json | head -n 20

          # Send PATCH request to update the spec
          echo "🚀 Uploading spec to Postman SpecHub..."
          response=$(curl -s -w "\n%{http_code}" --location --request PATCH "https://api.getpostman.com/specs/${POSTMAN_SPEC_ID}/files/index.yaml" \
            --header "Content-Type: application/json" \
            --header "X-API-Key: ${POSTMAN_API_KEY}" \
            --data @payload.json)
          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n1)

          if [[ "$status" == "200" ]]; then
            echo "✅ Spec updated successfully!"
          else
            echo "❌ Failed to update spec (HTTP $status):"
            echo "$body"
            exit 1
          fi
          echo "🔄 Syncing Postman Collection with Spec..."
          response=$(curl -s -w "\n%{http_code}" --location --request PUT \
          "https://api.getpostman.com/collections/${POSTMAN_COLLECTION_ID}/synchronizations?specId=${POSTMAN_SPEC_ID}" \
          --header "X-API-Key: ${POSTMAN_API_KEY}" \
          --header "Content-Type: application/json")
          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n1)
          echo "Status Code: $status"
          if [[ "$status" == "200" || "$status" == "201" || "$status" == "202" ]]; then
          echo "✅ Sync triggered successfully"
          elif [[ "$status" == "400" ]]; then
          # Check if the detail message indicates already in sync
          if echo "$body" | grep -q "Collection is already in sync"; then
          echo "✅ Collection is already in sync"
          else
          echo "❌ Failed to sync (HTTP $status):"
          echo "$body"
          exit 3
          fi
          else
          echo "❌ Failed to sync (HTTP $status):"
          echo "$body"
          exit 1
          fi
