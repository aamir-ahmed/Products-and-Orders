name: Update Postman SpecHub Spec

on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.yaml'
      - '**/*.json'

jobs:
  update-spec:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: 🔍 Checkout repo
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: 🔍 Find Swagger File
        id: find_swagger
        run: |
          SWAGGER_FILE=$(find . -maxdepth 2 -type f \( -iname "*.yaml" -o -iname "*.json" \) | head -n 1)
          if [[ -z "$SWAGGER_FILE" ]]; then
            echo "❌ No Swagger file found."
            exit 1
          fi
          echo "SWAGGER_PATH=$SWAGGER_FILE" >> $GITHUB_ENV

      - name: 📁 Ensure config/spec-meta.json exists
        run: |
          mkdir -p config
          if [ ! -f config/spec-meta.json ]; then
            echo '{"POSTMAN_SPEC_ID": "", "POSTMAN_COLLECTION_ID": "", "LAST_UPDATED": ""}' > config/spec-meta.json
          fi

      - name: 📤 Read existing Postman IDs
        id: read_meta
        run: |
          export POSTMAN_SPEC_ID=$(jq -r '.POSTMAN_SPEC_ID' config/spec-meta.json)
          export POSTMAN_COLLECTION_ID=$(jq -r '.POSTMAN_COLLECTION_ID' config/spec-meta.json)
          echo "POSTMAN_SPEC_ID=${POSTMAN_SPEC_ID}" >> $GITHUB_ENV
          echo "POSTMAN_COLLECTION_ID=${POSTMAN_COLLECTION_ID}" >> $GITHUB_ENV

      - name: 🧪 Create Spec and Generate Collection (if not exists)
        if: env.POSTMAN_SPEC_ID == ''
        id: create_spec
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
          POSTMAN_WORKSPACE_ID: ${{ secrets.POSTMAN_WORKSPACE_ID }}
          SWAGGER_PATH: ${{ env.SWAGGER_PATH }}
        run: |
          ESCAPED_CONTENT=$(jq -Rs . < "$SWAGGER_PATH")

          jq -n \
            --arg name "Products & Orders" \
            --arg type "OPENAPI:3.0" \
            --arg content "$ESCAPED_CONTENT" \
            '{
              name: $name,
              type: $type,
              files: [{ path: "index.yaml", content: $content }]
            }' > create-spec-payload.json

          response=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.getpostman.com/specs?workspaceId=${POSTMAN_WORKSPACE_ID}" \
            -H "X-API-Key: ${POSTMAN_API_KEY}" \
            -H "Content-Type: application/json" \
            --data @create-spec-payload.json)

          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n1)

          if [[ "$status" =~ ^20[01]$ ]]; then
            spec_id=$(echo "$body" | jq -r '.spec.id')
            echo "✅ Spec created with ID: $spec_id"
            echo "POSTMAN_SPEC_ID=$spec_id" >> $GITHUB_ENV
          else
            echo "❌ Failed to create spec (HTTP $status)"
            echo "$body"
            exit 1
          fi

          echo "🕒 Waiting for spec to be ready..."
          for i in {1..10}; do
            sleep 5
            status=$(curl -s \
              -H "X-API-Key: ${POSTMAN_API_KEY}" \
              "https://api.getpostman.com/specs/${spec_id}" | jq -r '.spec.status')
            echo "📌 Spec status: $status"
            if [[ "$status" == "available" ]]; then break; fi
            if [[ $i -eq 10 ]]; then
              echo "❌ Spec not ready after waiting."
              exit 1
            fi
          done

          GEN_PAYLOAD='{"name":"Products & Orders","options":{"parametersResolution":"Example"}}'

          gen_response=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.getpostman.com/specs/${spec_id}/generations/collection" \
            -H "X-API-Key: ${POSTMAN_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$GEN_PAYLOAD")

          gen_status=$(echo "$gen_response" | tail -n1)
          if [[ "$gen_status" =~ ^20[0-2]$ ]]; then
            sleep 5
            collection_response=$(curl -s \
              -H "X-API-Key: ${POSTMAN_API_KEY}" \
              "https://api.getpostman.com/specs/${spec_id}/generations/collection")

            collection_id=$(echo "$collection_response" | jq -r '.collections[0].id')
            echo "✅ Collection created with ID: $collection_id"
            echo "POSTMAN_COLLECTION_ID=$collection_id" >> $GITHUB_ENV
          else
            echo "❌ Collection generation failed (HTTP $gen_status)"
            exit 1
          fi

      - name: 💾 Commit updated spec-meta.json
        if: env.POSTMAN_SPEC_ID != '' && env.POSTMAN_COLLECTION_ID != ''
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          jq -n \
            --arg spec_id "$POSTMAN_SPEC_ID" \
            --arg collection_id "$POSTMAN_COLLECTION_ID" \
            --arg updated "$TIMESTAMP" \
            '{
              POSTMAN_SPEC_ID: $spec_id,
              POSTMAN_COLLECTION_ID: $collection_id,
              LAST_UPDATED: $updated
            }' > config/spec-meta.json

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add config/spec-meta.json
          git commit -m "🔄 Update spec-meta.json after spec+collection creation"
          git push https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main

      - name: 🔄 Sync Collection (if spec already existed)
        if: env.POSTMAN_SPEC_ID != '' && env.POSTMAN_COLLECTION_ID != '' && steps.create_spec.outcome != 'success'
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
        run: |
          echo "🔄 Syncing existing collection..."
          response=$(curl -s -w "\n%{http_code}" -X PUT \
            "https://api.getpostman.com/collections/${POSTMAN_COLLECTION_ID}/synchronizations?specId=${POSTMAN_SPEC_ID}" \
            -H "X-API-Key: ${POSTMAN_API_KEY}" \
            -H "Content-Type: application/json")
          status=$(echo "$response" | tail -n1)
          [[ "$status" =~ ^20[0-2]$ ]] && echo "✅ Collection synced" || (echo "❌ Failed to sync collection" && exit 1)
