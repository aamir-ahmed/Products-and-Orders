name: 🚀 Update Postman Spec and Collection

on:
  push:
    paths:
      - 'Products-and-orders.yaml'
  workflow_dispatch:

jobs:
  update-postman-assets:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: 🔍 Checkout repository
        uses: actions/checkout@v3

      - name: 🌐 Set up Node.js (for consistency)
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: ⚖️ Install required tools
        run: |
          sudo apt-get update && sudo apt-get install -y jq

      - name: 📂 Read existing Postman IDs
        id: read_meta
        run: |
          if [ -f config/spec-meta.json ]; then
            POSTMAN_SPEC_ID=$(jq -r '.POSTMAN_SPEC_ID' config/spec-meta.json)
            POSTMAN_COLLECTION_ID=$(jq -r '.POSTMAN_COLLECTION_ID' config/spec-meta.json)
          else
            POSTMAN_SPEC_ID=""
            POSTMAN_COLLECTION_ID=""
          fi
          echo "POSTMAN_SPEC_ID=$POSTMAN_SPEC_ID" >> $GITHUB_ENV
          echo "POSTMAN_COLLECTION_ID=$POSTMAN_COLLECTION_ID" >> $GITHUB_ENV

      - name: 🐛 Debug ENV
        run: |
          echo "POSTMAN_SPEC_ID = ${{ env.POSTMAN_SPEC_ID }}"
          echo "POSTMAN_COLLECTION_ID = ${{ env.POSTMAN_COLLECTION_ID }}"

      - name: 🛠️ Create or Update Spec and Collection
        run: |
          SWAGGER_PATH="Products-and-orders.yaml"
          CONTENT=$(jq -Rs . < "$SWAGGER_PATH")
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          if [[ -z "${POSTMAN_SPEC_ID}" || "${POSTMAN_SPEC_ID}" == "null" ]]; then
            echo "📄 Creating new spec..."

            jq -n \
              --arg name "Products & Orders" \
              --arg type "OPENAPI:3.0" \
              --argjson content "$CONTENT" \
              '{
                name: $name,
                type: $type,
                files: [{ path: "index.yaml", content: $content }]
              }' > create-spec-payload.json

            response=$(curl -s -w "\n%{http_code}" -X POST \
              "https://api.getpostman.com/specs?workspaceId=${{ secrets.POSTMAN_WORKSPACE_ID }}" \
              -H "X-API-Key: ${{ secrets.POSTMAN_API_KEY }}" \
              -H "Content-Type: application/json" \
              --data @create-spec-payload.json)

            body=$(echo "$response" | head -n -1)
            status=$(echo "$response" | tail -n1)
            echo "📦 Spec creation response:"
            echo "$body" | jq .

            if [[ "$status" =~ ^20[01]$ ]]; then
              spec_id=$(echo "$body" | jq -r '.spec.id')
              echo "✅ Spec created: $spec_id"
              echo "POSTMAN_SPEC_ID=$spec_id" >> $GITHUB_ENV
              echo "$spec_id" > .spec_id_tmp
            else
              echo "❌ Failed to create spec (HTTP $status)"
              exit 1
            fi
          else
            echo "🔁 Updating existing spec: $POSTMAN_SPEC_ID"

            jq -n \
              --argjson content "$CONTENT" \
              '{
                files: [{ path: "index.yaml", content: $content }]
              }' > update-spec.json

            curl -s -X PUT \
              "https://api.getpostman.com/specs/${POSTMAN_SPEC_ID}" \
              -H "X-API-Key: ${{ secrets.POSTMAN_API_KEY }}" \
              -H "Content-Type: application/json" \
              --data @update-spec.json

            echo "$POSTMAN_SPEC_ID" > .spec_id_tmp
          fi

      - name: ⚙️ Generate and Sync Collection
        run: |
          spec_id=$(cat .spec_id_tmp)
          echo "Using spec_id: $spec_id"

          echo "🔄 Generating collection..."
          GEN_PAYLOAD='{"name":"Products & Orders","options":{"parametersResolution":"Example"}}'

          gen_response=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.getpostman.com/specs/${spec_id}/generations/collection" \
            -H "X-API-Key: ${{ secrets.POSTMAN_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "$GEN_PAYLOAD")

          gen_status=$(echo "$gen_response" | tail -n1)

          if [[ "$gen_status" =~ ^20[0-2]$ ]]; then
            sleep 5
            collection_response=$(curl -s -X GET \
              "https://api.getpostman.com/specs/${spec_id}/generations/collection" \
              -H "X-API-Key: ${{ secrets.POSTMAN_API_KEY }}")
            collection_id=$(echo "$collection_response" | jq -r '.collections[0].id')
            echo "✅ Collection ID: $collection_id"
            echo "POSTMAN_COLLECTION_ID=$collection_id" >> $GITHUB_ENV
            echo "$collection_id" > .collection_id_tmp
          else
            echo "❌ Collection generation failed (HTTP $gen_status)"
            exit 1
          fi

      - name: 🖊️ Write spec-meta.json
        if: steps.read_meta.outputs.POSTMAN_SPEC_ID == ''
        run: |
          spec_id=$(cat .spec_id_tmp)
          collection_id=$(cat .collection_id_tmp)
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          jq -n \
            --arg spec "$spec_id" \
            --arg col "$collection_id" \
            --arg time "$TIMESTAMP" \
            '{POSTMAN_SPEC_ID: $spec, POSTMAN_COLLECTION_ID: $col, LAST_UPDATED: $time}' \
            > config/spec-meta.json

      - name: 📅 Commit spec-meta.json update
        if: steps.read_meta.outputs.POSTMAN_SPEC_ID == ''
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add config/spec-meta.json
          git commit -m "🔄 Update spec-meta.json after new spec creation"
          git push
