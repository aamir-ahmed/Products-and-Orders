#!/usr/bin/env bash
set -euo pipefail

WORKSPACE_ID="c1414f01-d83c-479a-af2a-c90b5a5f9539"
SPEC_NAME="Accounting-automated API"
SPEC_TYPE="OPENAPI:3.0"
FILE_PATH="index.yaml"
META_FILE="postman-spec-meta.json"

# 1. Bundle spec at runtime
npx @redocly/cli bundle Accounting.yaml \
  --output bundled-accounting.yaml \
  --ext yaml

# 2. Check if specId is already stored
SPEC_ID=""

if [ -f "$META_FILE" ]; then
  SPEC_ID=$(jq -r '.specId // empty' "$META_FILE")
fi

if [ -n "$SPEC_ID" ]; then
  echo "Found specId: $SPEC_ID. Updating existing spec file..."

  jq -n \
    --rawfile content bundled-accounting.yaml \
    --arg name "$FILE_PATH" \
    --arg type "$SPEC_TYPE" \
    '{
      content: $content,
      name: $name,
      type: $type
    }' > update-payload.json

  curl --location --request PATCH \
    "https://api.getpostman.com/specs/$SPEC_ID/files/$FILE_PATH" \
    --header "Content-Type: application/json" \
    --header "X-API-Key: $POSTMAN_API_KEY" \
    --data-binary @update-payload.json

else
  echo "No specId found. Creating new spec..."

  jq -n \
    --rawfile content bundled-accounting.yaml \
    --arg name "$SPEC_NAME" \
    --arg type "$SPEC_TYPE" \
    --arg path "$FILE_PATH" \
    '{
      name: $name,
      type: $type,
      files: [
        {
          path: $path,
          content: $content
        }
      ]
    }' > create-payload.json

  CREATE_RESPONSE=$(curl --silent --location --request POST \
    "https://api.getpostman.com/specs?workspaceId='$WORKSPACE_ID'" \
    --header "Content-Type: application/json" \
    --header "X-API-Key: $POSTMAN_API_KEY" \
    --data-binary @create-payload.json)

  SPEC_ID=$(echo "$CREATE_RESPONSE" | jq -r '.spec.id // .id // empty')

  if [ -z "$SPEC_ID" ]; then
    echo "Could not extract specId from create response:"
    echo "$CREATE_RESPONSE"
    exit 1
  fi

  jq -n \
    --arg workspaceId "$WORKSPACE_ID" \
    --arg specId "$SPEC_ID" \
    --arg filePath "$FILE_PATH" \
    '{
      workspaceId: $workspaceId,
      specId: $specId,
      filePath: $filePath
    }' > "$META_FILE"

  echo "Created spec and saved metadata to $META_FILE"
fi
