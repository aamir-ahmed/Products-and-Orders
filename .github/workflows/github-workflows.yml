name: 🚀 Update Postman Spec and Collection
permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.yaml'

jobs:
  update-postman-assets:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: 🔍 Checkout repository
        uses: actions/checkout@v3

      - name: 🌐 Set up Node.js (for consistency)
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: ⚖️ Install required tools
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: 📂 Read existing Postman IDs
        id: read_meta
        run: |
          if [ -f config/spec-meta.json ]; then
            POSTMAN_SPEC_ID=$(jq -r '.POSTMAN_SPEC_ID' config/spec-meta.json)
            POSTMAN_COLLECTION_ID=$(jq -r '.POSTMAN_COLLECTION_ID' config/spec-meta.json)
          else
            POSTMAN_SPEC_ID=""
            POSTMAN_COLLECTION_ID=""
          fi
          echo "POSTMAN_SPEC_ID=$POSTMAN_SPEC_ID" >> $GITHUB_ENV
          echo "POSTMAN_COLLECTION_ID=$POSTMAN_COLLECTION_ID" >> $GITHUB_ENV
      - name: ♻️ Update existing Spec and sync updates to Collection
        if: env.POSTMAN_SPEC_ID != '' && env.POSTMAN_SPEC_ID != 'null'
        run: |
          SWAGGER_PATH=$(find . -type f \( -name "*.yaml" -o -name "*.json" \) | head -n1)
          SPEC_NAME=$(basename "$SWAGGER_PATH" | sed 's/\.[^.]*$//')
          SPEC_CONTENT=$(jq -Rs . < "$SWAGGER_PATH")
          echo "{\"content\": ${SPEC_CONTENT}}" > payload.json
          echo "📤 Sending PATCH request to update spec..."
          response=$(curl -s -w "\n%{http_code}" -X PATCH \
            "https://api.getpostman.com/specs/${POSTMAN_SPEC_ID}/files/index.yaml" \
            -H "Content-Type: application/json" \
            -H "X-API-Key: ${{ secrets.POSTMAN_API_KEY }}" \
            --data @payload.json)
          status=$(tail -n1 <<< "$response")
          if [[ "$status" == "200" || "$status" == "202" ]]; then
            echo "✅ Spec updated successfully!"
          else
            echo "❌ Failed to update spec (HTTP $status)"
            exit 1
          fi
          echo "📤 Syncing spec to collection..."
          sync_status=$(curl -s -w "\n%{http_code}" -X PUT \
            "https://api.getpostman.com/collections/${POSTMAN_COLLECTION_ID}/synchronizations?specId=${POSTMAN_SPEC_ID}" \
            -H "X-API-Key: ${{ secrets.POSTMAN_API_KEY }}" | tail -n1)
          if [[ "$sync_status" == "200" || "$sync_status" == "202" ]]; then
            echo "✅ Collection synced successfully!"
          else
            echo "❌ Failed to sync collection (HTTP $sync_status)"
            exit 1
          fi
      - name: 📈 Create Spec and Collection if IDs not present
        if: env.POSTMAN_SPEC_ID == '' || env.POSTMAN_SPEC_ID == 'null'
        run: |
          SWAGGER_PATH=$(find . -type f \( -name "*.yaml" -o -name "*.json" \) | head -n1)
          SPEC_NAME=$(basename "$SWAGGER_PATH" | sed 's/\.[^.]*$//')
          jq -n --rawfile content "$SWAGGER_PATH" --arg name "$SPEC_NAME" --arg type "OPENAPI:3.0" \
            '{name: $name, type: $type, files: [{ path: "index.yaml", content: $content }]}' > create-spec-payload.json
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.getpostman.com/specs?workspaceId=${{ secrets.POSTMAN_WORKSPACE_ID }}" \
            -H "X-API-Key: ${{ secrets.POSTMAN_API_KEY }}" \
            -H "Content-Type: application/json" \
            --data @create-spec-payload.json)
          body=$(head -n -1 <<< "$response")
          status=$(tail -n1 <<< "$response")
          spec_id=$(jq -r '.spec.id // .id' <<< "$body")
          if [[ -z "$spec_id" || "$spec_id" == "null" ]]; then
            echo "❌ Failed to extract spec ID"
            exit 1
          fi
          echo "✅ Spec created with ID: $spec_id"
          echo "POSTMAN_SPEC_ID=$spec_id" >> $GITHUB_ENV
          echo "🔄 Waiting for spec processing..."
          sleep 4
          GEN_PAYLOAD=$(jq -n --arg name "$SPEC_NAME" '{name: $name, options: {parametersResolution: "Example"}}')
          gen_response=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.getpostman.com/specs/${spec_id}/generations/collection" \
            -H "X-API-Key: ${{ secrets.POSTMAN_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "$GEN_PAYLOAD")
          gen_status=$(tail -n1 <<< "$gen_response")
          if [[ "$gen_status" =~ ^20[0-2]$ ]]; then
            for i in {1..5}; do
              echo "⏳ Checking collection generation... (try $i)"
              sleep 2
              collection_response=$(curl -s -X GET \
                "https://api.getpostman.com/specs/${spec_id}/generations/collection" \
                -H "X-API-Key: ${{ secrets.POSTMAN_API_KEY }}")
              collection_id=$(jq -r '.collections[0].id // empty' <<< "$collection_response")
              if [[ -n "$collection_id" ]]; then
                echo "✅ Collection created with ID: $collection_id"
                echo "POSTMAN_COLLECTION_ID=$collection_id" >> $GITHUB_ENV
                echo "NEW_SPEC_CREATED=true" >> $GITHUB_ENV
                break
              fi
            done
            if [[ -z "$collection_id" ]]; then
              echo "❌ Failed to extract collection ID"
              exit 1
            fi
          else
            echo "❌ Collection generation failed (HTTP $gen_status)"
            exit 1
          fi
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          jq -n --arg spec "$spec_id" --arg col "$collection_id" --arg time "$TIMESTAMP" \
            '{POSTMAN_SPEC_ID: $spec, POSTMAN_COLLECTION_ID: $col, LAST_UPDATED: $time}' > config/spec-meta.json
      - name: 🗓️ Commit spec-meta.json update
        if: env.NEW_SPEC_CREATED == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}
          git add config/spec-meta.json
          git commit -m "🔄 Update spec-meta.json after new spec creation"
          git push
