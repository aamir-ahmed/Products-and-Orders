name: 🚀 Update Postman Spec and Collection
permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    paths:
      - '**/Products-and-orders.yaml'

jobs:
  update-postman-assets:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: 🔍 Checkout repository
        uses: actions/checkout@v3

      - name: 🌐 Set up Node.js (for consistency)
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: ⚖️ Install required tools
        run: |
          sudo apt-get update && sudo apt-get install -y jq

      - name: 📂 Read existing Postman IDs
        id: read_meta
        run: |
          if [ -f config/spec-meta.json ]; then
            export POSTMAN_SPEC_ID=$(jq -r '.POSTMAN_SPEC_ID' config/spec-meta.json)
            export POSTMAN_COLLECTION_ID=$(jq -r '.POSTMAN_COLLECTION_ID' config/spec-meta.json)
          else
            export POSTMAN_SPEC_ID=""
            export POSTMAN_COLLECTION_ID=""
          fi
          echo "POSTMAN_SPEC_ID=$POSTMAN_SPEC_ID" >> $GITHUB_ENV
          echo "POSTMAN_COLLECTION_ID=$POSTMAN_COLLECTION_ID" >> $GITHUB_ENV

      - name: ♻️ Update existing Spec and sync updates to Collection
        if: env.POSTMAN_SPEC_ID != '' && env.POSTMAN_SPEC_ID != 'null'
        run: |
          SWAGGER_PATH="./Products-and-orders.yaml"
          CONTENT=$(cat "$SWAGGER_PATH")

          jq -n \
            --arg content "$CONTENT" \
            '{
              files: [{ path: "index.yaml", content: $content }]
            }' > update-spec-payload.json

          echo "📤 Updating existing Spec..."
          update_response=$(curl -s -o /dev/null -w "%{http_code}" -X PUT \
            "https://api.getpostman.com/specs/${POSTMAN_SPEC_ID}" \
            -H "X-API-Key: ${{ secrets.POSTMAN_API_KEY }}" \
            -H "Content-Type: application/json" \
            --data @update-spec-payload.json)

          echo "🔁 Spec update response code: $update_response"

          if [[ "$update_response" =~ ^20[0-4]$ ]]; then
            echo "✅ Spec updated successfully. Triggering collection regeneration..."

            GEN_PAYLOAD='{"name":"Products & Orders","options":{"parametersResolution":"Example"}}'

            curl -s -X PUT \
              "https://api.getpostman.com/collections/${POSTMAN_COLLECTION_ID}/synchronizations?specId=${POSTMAN_SPEC_ID}" \
              -H "X-API-Key: ${{ secrets.POSTMAN_API_KEY }}" \
              -H "Content-Type: application/json" \
              -d "$GEN_PAYLOAD"
          else
            echo "❌ Failed to update Spec (HTTP $update_response)"
            exit 1
          fi

      - name: 📈 Create Spec and Collection if IDs not present
        if: env.POSTMAN_SPEC_ID == '' || env.POSTMAN_SPEC_ID == 'null'
        run: |
          export POSTMAN_API_KEY=${{ secrets.POSTMAN_API_KEY }}
          export WORKSPACE_ID=${{ secrets.POSTMAN_WORKSPACE_ID }}
          SWAGGER_PATH="./Products-and-orders.yaml"

          jq -n \
            --rawfile content "$SWAGGER_PATH" \
            --arg name "Products & Orders" \
            --arg type "OPENAPI:3.0" \
            '{
              name: $name,
              type: $type,
              files: [{ path: "index.yaml", content: $content }]
            }' > create-spec-payload.json

          response=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.getpostman.com/specs?workspaceId=${WORKSPACE_ID}" \
            -H "X-API-Key: $POSTMAN_API_KEY" \
            -H "Content-Type: application/json" \
            --data @create-spec-payload.json)

          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n1)

          echo "📨 API response:"
          echo "$body"

          spec_id=$(echo "$body" | jq -r '.spec.id // .id')

          if [[ -z "$spec_id" || "$spec_id" == "null" ]]; then
            echo "❌ Failed to extract spec ID from response."
            exit 1
          fi

          echo "✅ Spec created with ID: $spec_id"
          echo "POSTMAN_SPEC_ID=$spec_id" >> $GITHUB_ENV

          echo "🔄 Waiting before generating collection..."
          sleep 5

          GEN_PAYLOAD='{"name":"Products & Orders","options":{"parametersResolution":"Example"}}'

          echo "📤 Generating collection from spec ID: $spec_id"

          gen_response=$(curl -s --retry 3 --retry-delay 5 -w "\n%{http_code}" -X POST \
            "https://api.getpostman.com/specs/${spec_id}/generations/collection" \
            -H "X-API-Key: $POSTMAN_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$GEN_PAYLOAD")

          gen_body=$(echo "$gen_response" | head -n -1)
          gen_status=$(echo "$gen_response" | tail -n1)

          if [[ "$gen_status" =~ ^20[0-2]$ ]]; then
            echo "✅ Generation request accepted. Waiting for result..."
            sleep 5

            collection_response=$(curl -s --retry 3 --retry-delay 5 -X GET \
              "https://api.getpostman.com/specs/${spec_id}/generations/collection" \
              -H "X-API-Key: $POSTMAN_API_KEY")

            echo "✅ Collection generation result:"
            echo "$collection_response"

            collection_id=$(echo "$collection_response" | jq -r '.collections[0].id // empty')

            if [[ -n "$collection_id" ]]; then
              echo "✅ Collection created with ID: $collection_id"
              echo "POSTMAN_COLLECTION_ID=$collection_id" >> $GITHUB_ENV
              echo "NEW_SPEC_CREATED=true" >> $GITHUB_ENV
            else
              echo "❌ Failed to extract collection ID from generation response."
              exit 1
            fi
          else
            echo "❌ Collection generation request failed (HTTP $gen_status)"
            echo "$gen_body"
            exit 1
          fi

          echo "🖊️ Updating config/spec-meta.json"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          jq -n \
            --arg spec "$spec_id" \
            --arg col "$collection_id" \
            --arg time "$TIMESTAMP" \
            '{POSTMAN_SPEC_ID: $spec, POSTMAN_COLLECTION_ID: $col, LAST_UPDATED: $time}' \
            > config/spec-meta.json

      - name: 📅 Commit spec-meta.json update
        if: env.NEW_SPEC_CREATED == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}
          git add config/spec-meta.json
          git commit -m "🔄 Update spec-meta.json after new spec creation"
          git push
