name: Update Postman Spec and Collection

on:
  workflow_dispatch:
  push:
    paths:
      - "Products-and-orders.yaml"
      - "config/spec-meta.json"

jobs:
  update-postman:
    runs-on: ubuntu-latest
    steps:
      - name: 🔍 Checkout repo
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: 🧪 Check if spec-meta.json exists
        id: check-meta
        run: |
          if [ -f config/spec-meta.json ]; then
            META=$(cat config/spec-meta.json)
            SPEC_ID=$(echo "$META" | jq -r '.POSTMAN_SPEC_ID // empty')
            COLLECTION_ID=$(echo "$META" | jq -r '.POSTMAN_COLLECTION_ID // empty')
          fi

          echo "spec_id=$SPEC_ID" >> $GITHUB_OUTPUT
          echo "collection_id=$COLLECTION_ID" >> $GITHUB_OUTPUT

      - name: 🚀 Create Spec and Generate Collection
        if: steps.check-meta.outputs.spec_id == ''
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
          POSTMAN_WORKSPACE_ID: ${{ secrets.POSTMAN_WORKSPACE_ID }}
        run: |
          CONTENT=$(cat Products-and-orders.yaml)
          ESCAPED_CONTENT=$(jq -Rs . <<< "$CONTENT")

          jq -n \
            --arg name "Products & Orders" \
            --arg type "OPENAPI:3.0" \
            --arg content "$ESCAPED_CONTENT" \
            '{
              name: $name,
              type: $type,
              files: [{
                path: "index.yaml",
                content: ($content | fromjson)
              }]
            }' > create-spec-payload.json

          echo "📤 Creating Postman Spec..."
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.getpostman.com/specs?workspaceId=${POSTMAN_WORKSPACE_ID}" \
            -H "Content-Type: application/json" \
            -H "X-API-Key: ${POSTMAN_API_KEY}" \
            --data @create-spec-payload.json)

          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n1)

          if [[ "$status" =~ ^20[01]$ ]]; then
            spec_id=$(echo "$body" | jq -r '.spec.id')
            echo "✅ Spec created with ID: $spec_id"
          else
            echo "❌ Failed to create spec (HTTP $status)"
            echo "$body"
            exit 1
          fi

          echo "⏳ Waiting for Spec to be ready..."
          for i in {1..10}; do
            sleep 5
            status_response=$(curl -s -X GET \
              "https://api.getpostman.com/specs/${spec_id}" \
              -H "X-API-Key: ${POSTMAN_API_KEY}")
            spec_status=$(echo "$status_response" | jq -r '.spec.status')

            echo "📌 Spec status: $spec_status"
            if [[ "$spec_status" == "resolved" ]]; then
              break
            fi
            if [[ $i -eq 10 ]]; then
              echo "❌ Spec not ready after waiting."
              exit 1
            fi
          done

          echo "⚙️ Generating Collection..."
          gen_payload='{"name":"Products & Orders","options":{"parametersResolution":"Example"}}'

          gen_response=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.getpostman.com/specs/${spec_id}/generations/collection" \
            -H "Content-Type: application/json" \
            -H "X-API-Key: ${POSTMAN_API_KEY}" \
            -d "$gen_payload")

          gen_status=$(echo "$gen_response" | tail -n1)
          if [[ "$gen_status" =~ ^20[0-2]$ ]]; then
            sleep 5
            collection_response=$(curl -s -X GET \
              "https://api.getpostman.com/specs/${spec_id}/generations/collection" \
              -H "X-API-Key: ${POSTMAN_API_KEY}")
            collection_id=$(echo "$collection_response" | jq -r '.collections[0].id')
            echo "✅ Collection generated with ID: $collection_id"
          else
            echo "❌ Collection generation failed (HTTP $gen_status)"
            exit 1
          fi

          echo "POSTMAN_SPEC_ID=$spec_id" >> $GITHUB_ENV
          echo "POSTMAN_COLLECTION_ID=$collection_id" >> $GITHUB_ENV

      - name: 📝 Update spec-meta.json if new spec was created
        if: steps.check-meta.outputs.spec_id == ''
        run: |
          echo "Updating config/spec-meta.json..."
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          jq -n \
            --arg spec "$POSTMAN_SPEC_ID" \
            --arg col "$POSTMAN_COLLECTION_ID" \
            --arg ts "$TIMESTAMP" \
            '{
              POSTMAN_SPEC_ID: $spec,
              POSTMAN_COLLECTION_ID: $col,
              LAST_UPDATED: $ts
            }' > config/spec-meta.json

      - name: 💾 Commit updated spec-meta.json
        if: steps.check-meta.outputs.spec_id == ''
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add config/spec-meta.json
          git commit -m "🔄 Update spec-meta.json with new Spec & Collection ID"
          git push
