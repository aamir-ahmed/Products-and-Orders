name: 🚀 Update Postman Spec and Collection
permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    paths:
      - '**/Products-and-orders.yaml'

jobs:
  update-postman-assets:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: 🔍 Checkout repository
        uses: actions/checkout@v3

      - name: ⚖️ Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: 📂 Read existing Postman IDs
        id: read_meta
        run: |
          if [ -f config/spec-meta.json ]; then
            POSTMAN_SPEC_ID=$(jq -r '.POSTMAN_SPEC_ID' config/spec-meta.json)
            POSTMAN_COLLECTION_ID=$(jq -r '.POSTMAN_COLLECTION_ID' config/spec-meta.json)
          else
            POSTMAN_SPEC_ID=""
            POSTMAN_COLLECTION_ID=""
          fi
          echo "POSTMAN_SPEC_ID=$POSTMAN_SPEC_ID" >> $GITHUB_ENV
          echo "POSTMAN_COLLECTION_ID=$POSTMAN_COLLECTION_ID" >> $GITHUB_ENV

      - name: ♻️ Update existing Spec and sync Collection
        if: env.POSTMAN_SPEC_ID != '' && env.POSTMAN_SPEC_ID != 'null'
        run: |
          SWAGGER_PATH="./Products-and-orders.yaml"
          SPEC_CONTENT=$(jq -Rs . < "$SWAGGER_PATH")
          echo "{\"content\": ${SPEC_CONTENT}}" > payload.json

          echo "📤 Updating spec..."
          response=$(curl -s -w "\n%{http_code}" -X PATCH \
            "https://api.getpostman.com/specs/${POSTMAN_SPEC_ID}/files/index.yaml" \
            -H "Content-Type: application/json" \
            -H "X-API-Key: ${{ secrets.POSTMAN_API_KEY }}" \
            --data @payload.json)

          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n1)

          echo "📨 Response status: $status"
          [[ "$status" =~ ^20[0-2]$ ]] || { echo "$body"; exit 1; }

          echo "✅ Spec updated. Syncing collection..."
          sync_response=$(curl -s -w "\n%{http_code}" -X PUT \
            "https://api.getpostman.com/collections/${POSTMAN_COLLECTION_ID}/synchronizations?specId=${POSTMAN_SPEC_ID}" \
            -H "X-API-Key: ${{ secrets.POSTMAN_API_KEY }}")

          sync_body=$(echo "$sync_response" | head -n -1)
          sync_status=$(echo "$sync_response" | tail -n1)

          [[ "$sync_status" =~ ^20[0-2]$ ]] && echo "✅ Collection synced!" || { echo "$sync_body"; exit 1; }

      - name: 🆕 Create Spec and Generate Collection
        if: env.POSTMAN_SPEC_ID == '' || env.POSTMAN_SPEC_ID == 'null'
        run: |
          SWAGGER_PATH="./Products-and-orders.yaml"

          jq -n --rawfile content "$SWAGGER_PATH" \
            --arg name "Products & Orders" --arg type "OPENAPI:3.0" \
            '{name: $name, type: $type, files: [{ path: "index.yaml", content: $content }]}' > create-spec.json

          echo "📤 Creating new spec..."
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.getpostman.com/specs?workspaceId=${{ secrets.POSTMAN_WORKSPACE_ID }}" \
            -H "X-API-Key: ${{ secrets.POSTMAN_API_KEY }}" \
            -H "Content-Type: application/json" \
            --data @create-spec.json)

          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n1)
          [[ "$status" =~ ^20[0-2]$ ]] || { echo "$body"; exit 1; }

          spec_id=$(echo "$body" | jq -r '.spec.id // .id')
          [[ -n "$spec_id" && "$spec_id" != "null" ]] || { echo "❌ Spec ID missing"; exit 1; }

          echo "POSTMAN_SPEC_ID=$spec_id" >> $GITHUB_ENV
          echo "✅ Spec created: $spec_id"

          echo "📤 Triggering collection generation..."
          GEN_PAYLOAD='{"name":"Products & Orders","options":{"parametersResolution":"Example"}}'
          gen_response=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.getpostman.com/specs/${spec_id}/generations/collection" \
            -H "X-API-Key: ${{ secrets.POSTMAN_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "$GEN_PAYLOAD")

          gen_body=$(echo "$gen_response" | head -n -1)
          gen_status=$(echo "$gen_response" | tail -n1)
          [[ "$gen_status" =~ ^20[0-2]$ ]] || { echo "$gen_body"; exit 1; }

          echo "⏳ Polling for collection generation result..."
          for i in {1..6}; do
            collection_response=$(curl -s -X GET \
              "https://api.getpostman.com/specs/${spec_id}/generations/collection" \
              -H "X-API-Key: ${{ secrets.POSTMAN_API_KEY }}")

            collection_id=$(echo "$collection_response" | jq -r '.collections[0].id // empty')
            if [[ -n "$collection_id" ]]; then
              echo "✅ Collection created: $collection_id"
              echo "POSTMAN_COLLECTION_ID=$collection_id" >> $GITHUB_ENV
              echo "NEW_SPEC_CREATED=true" >> $GITHUB_ENV
              break
            else
              echo "🔄 Waiting 3s for collection..."
              sleep 3
            fi
          done

          [[ -n "$collection_id" ]] || { echo "❌ Failed to generate collection"; exit 1; }

          echo "🖊️ Writing spec-meta.json"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          jq -n \
            --arg spec "$spec_id" \
            --arg col "$collection_id" \
            --arg time "$TIMESTAMP" \
            '{POSTMAN_SPEC_ID: $spec, POSTMAN_COLLECTION_ID: $col, LAST_UPDATED: $time}' \
            > config/spec-meta.json

      - name: 📅 Commit updated spec-meta.json
        if: env.NEW_SPEC_CREATED == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}
          git add config/spec-meta.json
          git commit -m "🔄 Update spec-meta.json after new spec creation"
          git push
