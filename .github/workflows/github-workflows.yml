name: Update Postman SpecHub Spec

on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.yaml'
      - '**/*.yml'
      - '**/*.json'

jobs:
  update-spec:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v3

      - name: 📦 Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: 📄 Convert Swagger YAML to JSON
        run: |
          yq -o=json '.' "$SWAGGER_PATH" > openapi.json
        env:
          SWAGGER_PATH: ./Products-and-orders.yaml

      - name: 🚀 Create Postman Spec
        id: create-spec
        run: |
          ESCAPED_CONTENT=$(jq -Rs . < openapi.json)

          jq -n \
            --arg name "Products & Orders" \
            --arg type "OPENAPI:3.0" \
            --arg content "$ESCAPED_CONTENT" \
            '{
              name: $name,
              type: $type,
              files: [{
                path: "index.yaml",
                content: ($content | fromjson)
              }]
            }' > create-spec-payload.json

          response=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.getpostman.com/specs?workspaceId=${POSTMAN_WORKSPACE_ID}" \
            -H "Content-Type: application/json" \
            -H "X-API-Key: ${POSTMAN_API_KEY}" \
            --data @create-spec-payload.json)

          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n1)

          if [[ "$status" =~ ^20[01]$ ]]; then
            spec_id=$(echo "$body" | jq -r '.spec.id')
            echo "✅ Created Spec: $spec_id"
            echo "POSTMAN_SPEC_ID=$spec_id" >> $GITHUB_ENV
          else
            echo "❌ Failed to create spec (HTTP $status)"
            echo "$body"
            exit 1
          fi
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
          POSTMAN_WORKSPACE_ID: ${{ secrets.POSTMAN_WORKSPACE_ID }}

      - name: ⏳ Poll for Spec readiness
        run: |
          echo "🔁 Checking if spec is ready..."
          for i in {1..10}; do
            sleep 5
            status=$(curl -s -H "X-API-Key: ${POSTMAN_API_KEY}" \
              "https://api.getpostman.com/specs/${POSTMAN_SPEC_ID}" | jq -r '.spec.status')
            echo "📌 Spec status (attempt $i): $status"
            if [[ "$status" == "available" ]]; then
              echo "✅ Spec is ready."
              break
            fi
            if [[ "$i" -eq 10 ]]; then
              echo "❌ Spec not ready after waiting."
              exit 1
            fi
          done
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
          POSTMAN_SPEC_ID: ${{ env.POSTMAN_SPEC_ID }}

      - name: 📦 Generate Collection from Spec
        run: |
          GEN_PAYLOAD='{"name":"Products & Orders","options":{"parametersResolution":"Example"}}'

          gen_response=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.getpostman.com/specs/${POSTMAN_SPEC_ID}/generations/collection" \
            -H "Content-Type: application/json" \
            -H "X-API-Key: ${POSTMAN_API_KEY}" \
            -d "$GEN_PAYLOAD")

          gen_status=$(echo "$gen_response" | tail -n1)

          if [[ "$gen_status" =~ ^20[0-2]$ ]]; then
            sleep 5
            collection_response=$(curl -s -X GET \
              "https://api.getpostman.com/specs/${POSTMAN_SPEC_ID}/generations/collection" \
              -H "X-API-Key: ${POSTMAN_API_KEY}")
            collection_id=$(echo "$collection_response" | jq -r '.collections[0].id')
            echo "✅ Collection generated: $collection_id"
            echo "POSTMAN_COLLECTION_ID=$collection_id" >> $GITHUB_ENV
          else
            echo "❌ Collection generation failed (HTTP $gen_status)"
            exit 1
          fi
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
          POSTMAN_SPEC_ID: ${{ env.POSTMAN_SPEC_ID }}

      - name: 💾 Save spec and collection IDs to spec-meta.json
        run: |
          jq -n \
            --arg spec_id "$POSTMAN_SPEC_ID" \
            --arg collection_id "$POSTMAN_COLLECTION_ID" \
            '{
              POSTMAN_SPEC_ID: $spec_id,
              POSTMAN_COLLECTION_ID: $collection_id
            }' > config/spec-meta.json
        env:
          POSTMAN_SPEC_ID: ${{ env.POSTMAN_SPEC_ID }}
          POSTMAN_COLLECTION_ID: ${{ env.POSTMAN_COLLECTION_ID }}
