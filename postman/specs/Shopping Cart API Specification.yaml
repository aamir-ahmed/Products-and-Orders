openapi: 3.0.0
info:
  title: Shopping Cart API
  version: 1.0.0
  description: An API for managing a shopping cart with operations to add, update, remove items, list cart contents, and submit orders.

paths:
  /cart:
    get:
      summary: List items in the cart
      description: Retrieve all items currently in the user's shopping cart
      responses:
        '200':
          description: Successfully retrieved cart items
          content:
            application/json:
              example:
                items:
                  - id: "prod001"
                    name: "Wireless Headphones"
                    quantity: 2
                    price: 99.99
                  - id: "prod002"
                    name: "Smartphone Case"
                    quantity: 1
                    price: 19.99
                total: 219.97
        '400':
          description: Bad Request - Invalid request parameters
          content:
            application/json:
              example:
                error: "Invalid request"
                message: "The request could not be understood by the server due to malformed syntax"
        '401':
          description: Unauthorized - Authentication is required
          content:
            application/json:
              example:
                error: "Unauthorized"
                message: "Invalid credentials"
        '500':
          description: Internal Server Error
          content:
            application/json:
              example:
                error: "Internal Server Error"
                message: "An unexpected condition was encountered preventing the server from fulfilling the request"

    post:
      summary: Add item to cart
      description: Add a new item to the shopping cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                productId:
                  type: string
                quantity:
                  type: integer
                  minimum: 1
      responses:
        '201':
          description: Item successfully added to cart
          content:
            application/json:
              example:
                message: "Item added to cart"
                item:
                  id: "prod001"
                  name: "Wireless Headphones"
                  quantity: 2
                  price: 99.99
        '400':
          description: Bad Request - Invalid item or quantity
          content:
            application/json:
              example:
                error: "Bad Request"
                message: "Invalid product ID or quantity. Quantity must be greater than 0"
        '401':
          description: Unauthorized - Authentication is required
          content:
            application/json:
              example:
                error: "Unauthorized"
                message: "Invalid credentials"
        '500':
          description: Internal Server Error
          content:
            application/json:
              example:
                error: "Internal Server Error"
                message: "An unexpected condition was encountered preventing the server from fulfilling the request"

  /cart/items/{itemId}:
    put:
      summary: Update cart item
      description: Update the quantity of an existing item in the cart
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                quantity:
                  type: integer
                  minimum: 0
      responses:
        '200':
          description: Item quantity updated successfully
          content:
            application/json:
              example:
                message: "Item quantity updated"
                item:
                  id: "prod001"
                  name: "Wireless Headphones"
                  quantity: 3
                  price: 99.99
        '400':
          description: Bad Request - Invalid item or quantity
          content:
            application/json:
              example:
                error: "Bad Request"
                message: "Invalid item ID or quantity. Quantity cannot be negative"
        '401':
          description: Unauthorized - Authentication is required
          content:
            application/json:
              example:
                error: "Unauthorized"
                message: "Invalid credentials"
        '404':
          description: Not Found - Item not in cart
          content:
            application/json:
              example:
                error: "Not Found"
                message: "The specified item was not found in the cart"
        '500':
          description: Internal Server Error
          content:
            application/json:
              example:
                error: "Internal Server Error"
                message: "An unexpected condition was encountered preventing the server from fulfilling the request"

    delete:
      summary: Remove item from cart
      description: Remove a specific item from the shopping cart
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Item successfully removed from cart
          content:
            application/json:
              example:
                message: "Item removed from cart"
                removedItem:
                  id: "prod001"
                  name: "Wireless Headphones"
                  quantity: 2
                  price: 99.99
        '400':
          description: Bad Request - Invalid item ID
          content:
            application/json:
              example:
                error: "Bad Request"
                message: "Invalid item ID format"
        '401':
          description: Unauthorized - Authentication is required
          content:
            application/json:
              example:
                error: "Unauthorized"
                message: "Invalid credentials"
        '404':
          description: Not Found - Item not in cart
          content:
            application/json:
              example:
                error: "Not Found"
                message: "The specified item was not found in the cart"
        '500':
          description: Internal Server Error
          content:
            application/json:
              example:
                error: "Internal Server Error"
                message: "An unexpected condition was encountered preventing the server from fulfilling the request"

  /cart/submit:
    post:
      summary: Submit order
      description: Submit the current cart as an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                shippingAddress:
                  type: object
                  properties:
                    street:
                      type: string
                    city:
                      type: string
                    state:
                      type: string
                    zipCode:
                      type: string
                paymentMethod:
                  type: string
      responses:
        '201':
          description: Order successfully submitted
          content:
            application/json:
              example:
                orderId: "ord123456"
                status: "Processing"
                items:
                  - id: "prod001"
                    name: "Wireless Headphones"
                    quantity: 2
                    price: 99.99
                  - id: "prod002"
                    name: "Smartphone Case"
                    quantity: 1
                    price: 19.99
                total: 219.97
                shippingAddress:
                  street: "123 Main St"
                  city: "Anytown"
                  state: "CA"
                  zipCode: "12345"
        '400':
          description: Bad Request - Invalid order submission
          content:
            application/json:
              example:
                error: "Bad Request"
                message: "Invalid shipping address or payment method. All fields are required"
        '401':
          description: Unauthorized - Authentication is required
          content:
            application/json:
              example:
                error: "Unauthorized"
                message: "Invalid credentials"
        '404':
          description: Not Found - Empty Cart
          content:
            application/json:
              example:
                error: "Not Found"
                message: "Cannot submit order. Shopping cart is empty"
        '500':
          description: Internal Server Error
          content:
            application/json:
              example:
                error: "Internal Server Error"
                message: "An unexpected condition was encountered preventing the server from fulfilling the request"